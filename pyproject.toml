[project]
name = "btc-agent-team"
version = "0.1.0"
description = "텔레그램 한 창구로 지시하는 Claude 멀티 에이전트 - 데이터 도구"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tools"]
