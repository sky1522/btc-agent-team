# 리스크 분류 매핑. 모르는 항목은 추측하지 않고 "확인 필요"로 남긴다.
# 값을 고치거나 추가할 때는 근거(공식 문서 등)를 주석으로 남긴다.
# 마지막 수기 점검: 2026-10-31

[lockup]
# poolMeta(풀 설명)에 아래 단어가 있으면 "락업"
keywords = ["lock", "vesting", "cooldown", "unbond"]
# 대출(렌딩) 시장: 예치금은 시장 유동성 범위 안에서 수시 출금 가능 → "수시 출금"
free_withdraw_projects = [
  "aave-v3", "aave-v4", "fluid-lending", "venus-core-pool", "hyperlend-pooled",
  "benqi-lending", "kamino-lend", "morpho-blue", "compound-v3", "spark",
]
# 위 둘 다 아니면 "확인 필요"

[reward]
# poolMeta에 아래 단어가 있으면 보상 형태 "포인트" (APY에 반영 안 된 보상일 수 있음)
points_keywords = ["point"]
# 그 외: 보상 APY > 0 이면 "토큰", 아니면 "없음" (DefiLlama 기준)

# BTC 형태: 심볼(대문자) → [분류, 수탁형 여부]
# 여기에 없는 심볼은 "확인 필요"
[btc_form]
WBTC = ["수탁형 래핑 (BitGo)", true]
"WBTC.E" = ["수탁형 래핑 (WBTC 브리지)", true]
CBBTC = ["수탁형 (코인베이스)", true]
BTCB = ["수탁형 (바이낸스)", true]
LBTC = ["리퀴드 스테이킹 (Lombard)", false]
SOLVBTC = ["래핑 (Solv)", false]
XSOLVBTC = ["래핑 (Solv)", false]
TBTC = ["탈중앙 브리지 (Threshold)", false]
# 심볼 BTC는 체인이 Bitcoin일 때만 "네이티브 BTC". 다른 체인의 BTC 표기는 "확인 필요"
native_chain = "Bitcoin"

[chain]
# 신생 체인 기준: 메인넷 출시 후 new_months 개월 미만 (데이터 수집일 기준)
new_months = 24

# 체인 → 메인넷 출시 연월. 여기에 없는 체인은 "확인 필요"
[chain.launched]
Bitcoin = "2009-01"
Ethereum = "2015-07"
Tron = "2018-06"
Solana = "2020-03"
Polygon = "2020-05"
BSC = "2020-09"
Avalanche = "2020-09"
Stacks = "2021-01"
Arbitrum = "2021-08"
Starknet = "2021-11"
"OP Mainnet" = "2021-12"
Sui = "2023-05"
Mantle = "2023-07"
Base = "2023-08"
Sei = "2023-08"
Ink = "2024-12"
Berachain = "2025-02"
Monad = "2025-11"
