# 리스크 분류 매핑. 모르는 항목은 추측하지 않고 "확인 필요"로 남긴다.
# 값을 고치거나 추가할 때는 근거(공식 문서 등)를 주석으로 남긴다.
# 마지막 수기 점검: 2026-10-31

[lockup]
# poolMeta(풀 설명)에 아래 단어가 있으면 "락업"
keywords = ["lock", "vesting", "cooldown", "unbond"]
# 대출(렌딩) 시장: 예치금은 시장 유동성 범위 안에서 수시 출금 가능 → "수시 출금"
free_withdraw_projects = [
  "aave-v3", "aave-v4", "fluid-lending", "venus-core-pool", "hyperlend-pooled",
  "benqi-lending", "kamino-lend", "morpho-blue", "compound-v3", "spark",
]
# 위 둘 다 아니면 "확인 필요"

[reward]
# poolMeta에 아래 단어가 있으면 보상 형태 "포인트" (APY에 반영 안 된 보상일 수 있음)
points_keywords = ["point"]
# 그 외: 보상 APY > 0 이면 "토큰", 아니면 "없음" (DefiLlama 기준)

# BTC 형태: 심볼(대문자) → [분류, 수탁형 여부]
# 여기에 없는 심볼은 "확인 필요"
[btc_form]
WBTC = ["수탁형 래핑 (BitGo)", true]
"WBTC.E" = ["수탁형 래핑 (WBTC 브리지)", true]
CBBTC = ["수탁형 (코인베이스)", true]
BTCB = ["수탁형 (바이낸스)", true]
LBTC = ["수탁형 (Lombard 컨소시엄)", true]   # https://docs.lombard.finance/use/faq/lbtc
SOLVBTC = ["래핑 (Solv)", false]
XSOLVBTC = ["래핑 (Solv)", false]
TBTC = ["탈중앙 브리지 (Threshold)", false]
# 심볼 BTC는 체인이 Bitcoin일 때만 "네이티브 BTC". 다른 체인의 BTC 표기는 "확인 필요"
native_chain = "Bitcoin"

[chain]
# 신생 체인 기준: 메인넷 출시 후 new_months 개월 미만 (데이터 수집일 기준)
new_months = 24

# 체인 → 메인넷 출시 연월. 여기에 없는 체인은 "확인 필요"
[chain.launched]
Bitcoin = "2009-01"
Ethereum = "2015-07"
Tron = "2018-06"
Solana = "2020-03"
Polygon = "2020-05"
BSC = "2020-09"
Avalanche = "2020-09"
Stacks = "2021-01"
Arbitrum = "2021-08"
Starknet = "2021-11"
"OP Mainnet" = "2021-12"
Sui = "2023-05"
Mantle = "2023-07"
Base = "2023-08"
Sei = "2023-08"
Ink = "2024-12"
Berachain = "2025-02"
Monad = "2025-11"         # https://www.monad.xyz/announcements/get-started-on-monad-mainnet
Citrea = "2026-01"        # https://www.blog.citrea.xyz/citrea-mainnet-is-live
Mezo = "2025-05"          # https://mezo.org/docs/users/resources/release-notes/
"Hyperliquid L1" = "2025-02"   # HyperEVM https://app.hyperliquid.xyz/announcement/wctu4xz6fze

# 위험 등급 기준 (가장 나쁜 항목이 등급을 정함, docs/project-brief.md 참고)
[grade]
small_tvl_usd = 10_000_000   # 이 미만이면 높음
vol_high_pp = 1.0            # 30일 이자 변동(%p)이 이 이상이면 높음
vol_low_pp = 0.5             # 낮음이 되려면 이 미만

# 공식 문서로 확인한 풀별 값: "프로젝트|체인|심볼" (근거 링크 필수)
[pool]
# 2026-10-31 조사. 끝내 확인 못 한 항목은 넣지 않음 → "확인 필요"로 남음
"accountable|Monad|CBBTC" = { btc_form = "수탁형 (코인베이스 cbBTC, CCIP 브리지)", custodial = true, sources = ["https://monad.xyz/blog/cbbtc-on-monad"] }
"accountable|Citrea|WCBTC" = { btc_form = "래핑 (Citrea cBTC, Clementine 브리지)", custodial = false, sources = ["https://docs.citrea.xyz/essentials/clementine-trust-minimized-bitcoin-bridge.md", "https://docs.citrea.xyz/developer-documentation/canonical-contract-addresses.md"] }
"midas-rwa|Ethereum|BTC" = { btc_form = "토큰화 상품 (Midas mHyperBTC)", sources = ["https://docs.midas.app/liquidity-and-composability/open-liquidity-architecture"] }
"stackingdao|Stacks|STBTC" = { lockup = "출금 대기 약 28일", btc_form = "리퀴드 스테이킹 (sBTC 기반)", custodial = false, sources = ["https://docs.stackingdao.com/stackingdao/the-stacking-dao-app/stbtc-liquid-btc-staking-with-btc-rewards/withdrawing-from-stbtc.md"] }
"lombard-lbtc|Ethereum|LBTC" = { lockup = "출금 대기 최대 10일", btc_form = "수탁형 (Lombard 컨소시엄·Anchorage·Kraken)", custodial = true, sources = ["https://docs.lombard.finance/use/faq/lbtc"] }
"venus-core-pool|BSC|BTCB" = { lockup = "수시 출금", btc_form = "수탁형 (바이낸스)", custodial = true, sources = ["https://docs-v4.venus.io/getting-started/faq"] }
"ether.fi-stake|Ethereum|EBTC" = { lockup = "출금 대기 최대 7일", btc_form = "리퀴드 리스테이킹 볼트 (LBTC·WBTC 기반)", custodial = true, sources = ["https://etherfi.gitbook.io/etherfi/staking/ebtc"] }
