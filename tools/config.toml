# 데이터 도구 설정. 명령 인자 대신 이 파일을 고친다.
# 수집: uv run python tools/defillama_btc.py
# 분석: uv run python tools/analyze_yields.py

[paths]
# 프로젝트 루트 기준 상대 경로
yields = "data/yields.json"
history = "data/history.jsonl"
analysis = "data/analysis.json"
summary = "data/summary.json"         # reporter가 쓰는 AI 요약 (대시보드 표시용)
dashboard_html = "dashboard/index.html"
dashboard_data = "dashboard/data.json"
charts = "data/charts.json"           # 30일 추이 (추천·상위 풀만)
risk_map = "tools/risk_map.toml"     # 리스크 분류 매핑 (락업·보상·BTC 형태·체인)

[dashboard]
title = "BTC 예치 이자율"
summary_max_lines = 6

# 대시보드 공개 (tools/publish_dashboard.py). 이 파일들만 커밋·push한다.
[publish]
remote = "origin"
branch = "main"
# 게시 대상: 대시보드 산출물 + 수집 이력(자동 갱신이 이어 쓰도록) + 마지막 AI 요약
files = ["dashboard/index.html", "dashboard/data.json", "data/history.jsonl", "data/summary.json"]
pages_url = "https://sky1522.github.io/btc-agent-team/"

[collect]
url = "https://yields.llama.fi/pools"
timeout_sec = 60
source_name = "DefiLlama Yields"
pool_url_prefix = "https://defillama.com/yields/pool/"
chart_url_prefix = "https://yields.llama.fi/chart/"   # 풀별 일간 이력
chart_days = 30
chart_top_n = 15          # 예치형 기본 APY 상위 N개 + 대형 풀 상위 3개만 추이 수집
price_url = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,krw&include_last_updated_at=true"
price_source_name = "CoinGecko"

# 노이즈 제거 기준
min_tvl_usd = 5_000_000   # TVL 하한 (USD)
min_apy = 0.01            # APY 하한 (%). 이자가 거의 없는 빈 대출 풀 제외
exclude_outliers = true   # DefiLlama가 이상치로 표시한 풀 제외

# BTC 계열 토큰 (대문자). 심볼을 '-'로 나눈 구성 토큰이 모두 이 목록에 있어야 포함.
# 예) WBTC -> 포함, WBTC-CBBTC -> 포함, WBTC-USDC -> 제외
btc_tokens = [
  "BTC",                                   # 네이티브·체인별 BTC 표기
  "WBTC", "WBTC.E", "WBTC.B", "BTC.B",     # 래핑 (Ethereum, Avalanche 등)
  "CBBTC", "WCBTC",                        # Coinbase
  "TBTC",                                  # Threshold
  "BTCB",                                  # BNB Chain
  "LBTC",                                  # Lombard (스테이킹)
  "SOLVBTC", "XSOLVBTC",                   # Solv
  "UBTC", "XBTC", "KBTC", "FBTC", "EBTC",  # 기타 래핑
  "UNIBTC", "ENZOBTC", "PUMPBTC",          # 스테이킹·리스테이킹
  "STBTC", "STRKBTC",                      # Stacks(sBTC 기반)·Lorenzo, Starknet
  "HEMIBTC",
]
# 제외: STSTXBTC (기초자산이 STX. BTC가 아닌 자산을 맡기고 sBTC로 보상받는 상품)

# 풀 유형: DefiLlama exposure 값 → 표시 이름. 목록에 없으면 "기타"
[collect.type_by_exposure]
single = "예치형"   # 렌딩·스테이킹·리스테이킹 (토큰 1개를 맡김)
multi = "LP형"      # 유동성 공급 (토큰 2개 이상)

[analyze]
primary_type = "예치형"     # 기본 순위표·변화 분석 대상
secondary_type = "LP형"     # 별도 섹션으로만 표시
top_n = 10          # 상위 N개 (APY 기준)
base_top_n = 5      # 기본 APY(실제 이자) 기준 상위 N개
change_top_n = 10   # 전일 대비 변화 상위 N개 (절댓값 기준)
large_tvl_usd = 100_000_000   # 대형 풀 기준 TVL (USD)
reward_dependency_ratio = 0.5   # 보상 APY 비중이 이 값 이상이면 "보상 의존" 표시
